name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Guardrail 1 — Block secret logging
        run: |
          echo "Enforcing Guardrail 1: Secrets must not be logged"

          if grep -R "console.log(.*process.env" -n src/; then
            echo "❌ Guardrail violation detected: secret logging in source code"
            exit 1
          fi

      - name: Run tests
        run: npm test || echo "No tests configured"
