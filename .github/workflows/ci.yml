name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Guardrail 1 — Block secret logging
        run: |
          echo "Enforcing Guardrail 1: Secrets must not be logged"

          if grep -R "console.log(.*process.env" -n src/; then
            echo "❌ Guardrail violation detected: secret logging in source code"
            exit 1
          fi

      - name: Run tests
        run: npm test || echo "No tests configured"

      - name: Guardrail 1b — Block secret/env dumping
        run: |
          echo "Enforcing Guardrail 1: No secret or env dumping"

          # Direct secret logging
          if grep -R "console\.log(.*process\.env" -n src/; then
            echo "❌ Guardrail violation: direct env logging detected"
            exit 1
          fi

          # JSON/stringified env dumping
          if grep -R "JSON\.stringify(.*process\.env" -n src/; then
            echo "❌ Guardrail violation: env dump detected"
            exit 1
          fi

      - name: Guardrail 1c — Protect Docker build context
        run: |
          echo "Checking Docker build context safety..."

          # Ensure .dockerignore exists
          if [ ! -f .dockerignore ]; then
            echo "❌ Guardrail violation: .dockerignore missing"
            exit 1
          fi

          # Ensure env files are ignored
          if ! grep -E "^\.env(\..*)?$" .dockerignore; then
            echo "❌ Guardrail violation: .env not excluded in .dockerignore"
            exit 1
          fi



      - name: Guardrail 2 — Enforce approved base image
        run: |
          echo "Enforcing Guardrail 2: Approved base image only"

          # 1. Dockerfile must exist
          if [ ! -f Dockerfile ]; then
            echo "❌ Guardrail violation: Dockerfile not found"
            exit 1
          fi

          # 2. Block 'latest' or floating node tags
          if grep -E "^FROM node:(latest|18)$" Dockerfile; then
            echo "❌ Guardrail violation: floating Node image tag used"
            exit 1
          fi

          # 3. Enforce exact approved image
          if ! grep -E "^FROM (docker\.io/)?node:18-alpine$" Dockerfile; then
            echo "❌ Guardrail violation: unapproved base image used"
            exit 1
          fi

      - name: Guardrail 3 — Block mutable Docker image tags
        run: |
          echo "Enforcing Guardrail 3: No mutable Docker image tags"

          matches=$(
            grep -nE \
              "FROM .*:(latest|dev|prod)\b|docker (build|push).*:(latest|dev|prod)\b" \
              Dockerfile \
              .github/workflows/*.yml \
              2>/dev/null || true
          )

          if [ -n "$matches" ]; then
            echo "❌ Guardrail violation: mutable Docker image tag detected"
            echo "Offending locations:"
            echo "$matches"
            exit 1
          fi

      - name: Guardrail 3 — Phase 2: Define immutable image identity
        run: |
          echo "Enforcing Guardrail 3 Phase 2: Immutable image tagging"

          IMAGE_NAME="realworld-api"
          IMAGE_TAG="${GITHUB_SHA::7}"

          echo "Image will be built as: $IMAGE_NAME:$IMAGE_TAG"

          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ Guardrail violation: Image tag is empty"
            exit 1
          fi

          if [ "$IMAGE_TAG" = "latest" ] || [ "$IMAGE_TAG" = "dev" ] || [ "$IMAGE_TAG" = "prod" ]; then
            echo "❌ Guardrail violation: Mutable image tag detected"
            exit 1
          fi
